spring.application.name=registrar-camel

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/registrar}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:registrar_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:registrar_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

camel.springboot.main-run-controller=true
logging.level.com.university.registrar=INFO
